name: Deploy to GitHub Pages

# Push to the `main` branch -> the site goes live automatically.
# One-time setup in the repo: Settings -> Pages -> Source -> "GitHub Actions".
# Custom domain (optional): Settings -> Pages -> Custom domain, then add a
# file named `CNAME` at the repo root containing just the domain, e.g.:
#   portfolio.flowgt.co.nz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
